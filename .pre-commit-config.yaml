---
# Build hook environments with whatever `python3` is on PATH. Naming an exact
# minor (python3.13) makes env creation fail on any machine that does not have
# that exact interpreter. Pinning a version is unnecessary anyway: ruff's
# target-version is py313, so nothing the hooks read can use syntax that needs
# more than an older interpreter to parse.
default_language_version:
  python: python3

ci:
  autofix_prs: false
  autoupdate_commit_msg: "ci: [pre-commit.ci] pre-commit autoupdate"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
      - id: debug-statements
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md] # Do not process Markdown files.
      - id: end-of-file-fixer
      - id: check-ast
      - id: check-builtin-literals
      - id: check-toml

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: [--config=.flake8]
        additional_dependencies:
          [flake8-mutable]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^docs/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        exclude: ^docs/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pytest
          - types-Markdown

  - repo: local
    hooks:
      # The Definition of Done requires these suites; before this hook nothing ran
      # them — no CI workflow exists in this repo and the gate only typechecked
      # (Qodo 775217d5). Scoped to .ts changes so docs-only commits stay fast.
      - id: node-tests
        name: npx tsx --test tests/node/**/*.test.ts
        language: system
        # Git exports GIT_INDEX_FILE (a RELATIVE .git/index) and GIT_PREFIX into
        # hooks; tests that create temp worktrees inherit them and fail with
        # "index file open failed: Not a directory". PI_SUBAGENT_CHILD makes the
        # subagent tool early-return, failing the subagent tests from an agent
        # session. Strip both so the gate behaves the same for every committer.
        entry: >-
          bash -c 'test -f node_modules/.bin/tsx || { echo "node-tests: run npm install first"; exit 1; }; env -u GIT_INDEX_FILE -u GIT_PREFIX -u GIT_DIR -u PI_SUBAGENT_CHILD -u PI_SUBAGENT_NAME npx tsx --test "tests/node/**/*.test.ts"'
        pass_filenames: false
        files: \.(ts|tsx|mts)$|(^|/)(package\.json|tsconfig\.typecheck\.json)$
      - id: sidecar-tests
        name: npx tsx --test packages/pi-sidecar/tests/test_ts/*.test.ts
        language: system
        entry: >-
          bash -c 'test -f node_modules/.bin/tsx || { echo "sidecar-tests: run npm install first"; exit 1; }; env -u GIT_INDEX_FILE -u GIT_PREFIX -u GIT_DIR -u PI_SUBAGENT_CHILD -u PI_SUBAGENT_NAME npx tsx --test packages/pi-sidecar/tests/test_ts/*.test.ts'
        pass_filenames: false
        # extensions/shared/ is consumed by the sidecar: its changes must be
        # covered by the sidecar suite, not just by tests/node.
        files: \.(ts|tsx|mts)$|(^|/)(package\.json|tsconfig\.typecheck\.json)$
  - repo: local
    hooks:
      - id: tsc-typecheck
        name: npm run typecheck (repo TypeScript gate, issue #951)
        language: system
        # Fresh checkouts: npm install is a prerequisite (typescript + project
        # deps live in node_modules). Fail with an actionable message instead
        # of a cryptic tsc-not-found (Qodo PR #954).
        entry: >-
          bash -c 'test -x node_modules/.bin/tsc || { echo "tsc-typecheck: node_modules/.bin/tsc missing - run npm install first"; exit 1; }; npm run typecheck'
        pass_filenames: false
        # Full-project check: tsc -p cannot be scoped to staged files, so the
        # files filter only decides WHEN it runs, not WHAT it checks. Covers
        # .ts/.tsx/.mts (incl. .d.mts declarations), tsconfigs, and package.json
        # (dependency changes can break compilation) — Qodo PR #954.
        files: \.(ts|tsx|mts)$|(^|/)(tsconfig\.typecheck\.json|package\.json)$|/tsconfig\.json$

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        exclude: ^docs/
        args: [--config, .markdownlint.yaml]
        types: [markdown]
