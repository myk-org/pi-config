env_list = ["py", "node"]

[env.py]
skip_install = true
allowlist_externals = ["uv"]
set_env = {UV_PROJECT_ENVIRONMENT = "{env_dir}"}
# The docs generator is a workspace package with its own suite; it needs the
# `docs` group to import pi_docsite, and root testpaths=tests/python skips it.
commands = [
  ["uv", "run", "--group", "tests", "pytest", { replace = "posargs", default = [], extend = true }],
  ["uv", "run", "--group", "docs", "--group", "tests", "pytest", "packages/pi-docsite/tests"],
]

[env.node]
skip_install = true
allowlist_externals = ["npm", "npx", "sh"]
# Fresh CI worktrees have no node_modules (and package-lock.json is gitignored);
# bootstrap root workspaces and the standalone pidash-ui package when absent.
# --legacy-peer-deps avoids an npm 10 Arborist #loadPeerSet edgesOut crash on
# workspace peer-dependency resolution.
commands_pre = [
  ["sh", "-c", "test -x node_modules/.bin/tsc && test -x node_modules/.bin/tsx || npm install --no-audit --no-fund --legacy-peer-deps"],
  ["sh", "-c", "test -d extensions/pidash/pidash-ui/node_modules || npm --prefix extensions/pidash/pidash-ui install --no-audit --no-fund --legacy-peer-deps"],
]
# Runs repo TypeScript typecheck plus the root Node, pi-docsite browser-asset
# (jsdom), and pi-sidecar TypeScript test suites.
commands = [
  ["npm", "run", "typecheck"],
  ["npx", "tsx", "--test", "tests/node/**/*.test.ts"],
  ["npx", "tsx", "--test", "packages/pi-docsite/tests/js/**/*.test.ts"],
  ["npx", "tsx", "--test", "packages/pi-sidecar/tests/test_ts/*.test.ts"],
]
