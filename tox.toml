env_list = ["py", "node"]

[env.py]
skip_install = true
allowlist_externals = ["uv"]
set_env = {UV_PROJECT_ENVIRONMENT = "{env_dir}"}
# The docs generator is a workspace package with its own suite; it needs the
# `docs` group to import pi_docsite, and root testpaths=tests/python skips it.
commands = [
  ["uv", "run", "--group", "tests", "pytest", { replace = "posargs", default = [], extend = true }],
  ["uv", "run", "--group", "docs", "--group", "tests", "pytest", "packages/pi-docsite/tests"],
]

[env.node]
skip_install = true
allowlist_externals = ["node", "npm", "sh"]
# Fresh CI worktrees have no node_modules (and package-lock.json is gitignored);
# bootstrap root workspaces and the standalone pidash-ui package when absent.
# --legacy-peer-deps avoids an npm 10 Arborist #loadPeerSet edgesOut crash on
# workspace peer-dependency resolution.
# If host Node is compiled with small-icu without system full-i18n data (e.g.
# Fedora nodejs RPM), Intl.Segmenter segfaults — fetch matching full-icu data
# into the tox env dir and export NODE_ICU_DATA only when needed.
commands_pre = [
  ["sh", "-c", "test -x node_modules/.bin/tsc && test -x node_modules/.bin/tsx || npm install --no-audit --no-fund --legacy-peer-deps"],
  ["sh", "-c", "test -d extensions/pidash/pidash-ui/node_modules || npm --prefix extensions/pidash/pidash-ui install --no-audit --no-fund --legacy-peer-deps"],
  ["sh", "-c", "node -e 'Array.from(new Intl.Segmenter().segment(\"hi 👋\"))' 2>/dev/null || ls \"{env_dir}/icu/node_modules/full-icu\"/icudt*.dat >/dev/null 2>&1 || (mkdir -p \"{env_dir}/icu\" && node -e 'require(\"node:fs\").writeFileSync(process.argv[1], JSON.stringify(Object.create(null)))' \"{env_dir}/icu/package.json\" && npm --prefix \"{env_dir}/icu\" install --no-audit --no-fund full-icu)"],
]
# Runs repo TypeScript typecheck plus the root Node, pi-docsite browser-asset
# (jsdom), and pi-sidecar TypeScript test suites. Uses `node --import tsx` with
# bounded concurrency to avoid tsx wrapper / container worker contention.
commands = [
  ["npm", "run", "typecheck"],
  ["sh", "-c", "if ls \"{env_dir}/icu/node_modules/full-icu\"/icudt*.dat >/dev/null 2>&1; then export NODE_ICU_DATA=\"{env_dir}/icu/node_modules/full-icu\"; fi; node --import tsx --test --test-concurrency=4 'tests/node/**/*.test.ts'"],
  ["node", "--import", "tsx", "--test", "--test-concurrency=4", "packages/pi-docsite/tests/js/**/*.test.ts"],
  ["sh", "-c", "if ls \"{env_dir}/icu/node_modules/full-icu\"/icudt*.dat >/dev/null 2>&1; then export NODE_ICU_DATA=\"{env_dir}/icu/node_modules/full-icu\"; fi; node --import tsx --test --test-concurrency=4 'packages/pi-sidecar/tests/test_ts/*.test.ts'"],
]
