name: Docs

on:
  push:
    branches: [main]
    paths:
      # Any docs change, not just .md: the migration that removes the committed output touches
      # only generated paths, and it must still deploy.
      - "docs/**"
  # The first deploy after Pages is switched to build_type=workflow has no push to ride on.
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # workflow_dispatch accepts any ref, so without this guard `gh workflow run docs.yml --ref
    # some-branch` would publish that branch's docs/ to the live Pages site. Deploying is main-only;
    # a manual run is still how the first deploy after the Pages switch is triggered.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Building needs nothing but the sources: publish rights live on the deploy job alone, so
    # whatever the build step runs can never reach Pages.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build site from docs/*.md
        # The generator is this repo's own workspace package, not a PyPI release: the site is
        # built from the generator source in the commit being deployed. An unreviewed or
        # compromised `@latest` upload could otherwise write anything into the artifact the
        # credentialed deploy job publishes.
        run: >-
          uv run --package pi-docsite pi-docsite --docs-dir docs
          --tagline "Agent orchestration for pi: routing, subagents, background work, memory, providers, and sidecar."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The only job that publishes.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
