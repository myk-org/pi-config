name: Node Tests & Typecheck

on: pull_request

permissions:
  contents: read

jobs:
  node-tests:
    name: node-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure git identity for temp-repo tests
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@users.noreply.github.com"
      - name: Install dependencies
        run: npm install
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run Node test suite
        run: npx tsx --test "tests/node/**/*.test.ts"
      - name: Run pi-sidecar TS test suite
        run: npx tsx --test packages/pi-sidecar/tests/test_ts/*.test.ts
      - name: Run pi-vertex-claude test suite
        run: npm --prefix packages/pi-vertex-claude test
