[project]
name = "myk-pi-tools"
version = "4.3.9"
description = "CLI utilities for pi orchestrator plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "myk-org" }]
keywords = ["pi", "cli", "github", "code-review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0.0",
    "commentjson>=0.9.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "ai-cli-runner>=0.4.0",
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
myk-pi-tools = "myk_pi_tools.cli:main"

[project.urls]
Homepage = "https://github.com/myk-org/pi-config"
Repository = "https://github.com/myk-org/pi-config"
Issues = "https://github.com/myk-org/pi-config/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myk_pi_tools"]

# settings-keys.json lives at repo root; commands.py resolves it via
# Path(__file__).parent.parent.parent / "settings-keys.json" (site-packages/).
[tool.hatch.build.targets.wheel.force-include]
"settings-keys.json" = "settings-keys.json"

# Sdist is the Python package only. Default Hatch packing walks the monorepo
# and will put local `.claude/agents` absolute symlinks in the tarball; uv then
# refuses to unpack them.
[tool.hatch.build.targets.sdist]
only-include = [
  "myk_pi_tools",
  "settings-keys.json",
  "README.md",
]
exclude = [
  ".claude",
  ".cursor",
  ".gemini",
]

[tool.ruff]
preview = true
line-length = 120
fix = true
output-format = "grouped"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ARG", "RUF059"]

[tool.ruff.format]
exclude = [".git", ".venv", ".mypy_cache", ".tox", "__pycache__"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
warn_unused_configs = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[dependency-groups]
tests = ["pytest>=9.0.2"]
