[config]
add_repo_metadata = true
ignore_pr_title = ["^chore: bump version"]

# docs/*.html, docs/assets/*, llms*.txt and search-index.json are generated by
# pi-docsite from docs/*.md. The .md sources and nav.json stay in review scope:
# they are the repo's own work, and the fix for a generated-file finding belongs
# in the generator, not here.
[ignore]
glob = [
  "docs/*.html",
  "docs/assets/*",
  "docs/llms.txt",
  "docs/llms-full.txt",
  "docs/search-index.json",
]

[github_app]
handle_push_trigger = true
pr_commands = ["/agentic_review", "/agentic_describe"]
push_commands = ["/agentic_review"]

[review_agent]
comments_location_policy = "both"
inline_comments_severity_threshold = 1
