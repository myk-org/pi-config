[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-docsite"
# Single source of truth: the package __version__. Pinning the version here as
# well created two places to keep in step, and a release that bumped only one
# published a wheel whose metadata disagreed with its own tag.
dynamic = ["version"]
description = "Deterministic static documentation site generator for Markdown projects"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = ["markdown>=3.11", "jinja2>=3.1.6", "pygments>=2.21.0"]

[project.urls]
Repository = "https://github.com/myk-org/pi-config"

[project.scripts]
pi-docsite = "pi_docsite.generate:main"

[project.optional-dependencies]
dev = ["pytest>=8", "types-markdown>=3.5"]

[tool.setuptools.dynamic]
version = { attr = "pi_docsite.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pi_docsite.renderer" = ["templates/*.html", "static/*"]
"pi_docsite.skill" = ["*.md"]
